name: Deploy Y.U.R.A. Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloud/yura-cloud/**'

permissions:
  contents: write # Only used once, to commit the initial unpacked source files.

concurrency:
  group: yura-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify, migrate D1 and deploy existing yura-cloud
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets.'
            exit 1
          fi

      - name: Import v3.3.102 release sources on first run only
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f cloud/yura-cloud/src/index.ts ]]; then
            echo 'Cloud source exists; no bootstrap needed.'
            exit 0
          fi
          python3 cloud/tools/bootstrap_cloud.py \
            cloud/bootstrap/YURA_Cloud_v3.3.102.zip cloud/yura-cloud
          (
            cd cloud/yura-cloud
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- cloud/yura-cloud
          git commit -m 'Bootstrap editable Y.U.R.A. Cloud source v3.3.102'
          git push origin HEAD:main

      - name: Verify exact production Worker and D1 before any write
        shell: bash
        run: |
          set -euo pipefail
          config='cloud/yura-cloud/wrangler.toml'
          test -f "$config"
          grep -Eq '^name *= *"yura-cloud"$' "$config"
          grep -Eq '^database_name *= *"yura-cloud"$' "$config"
          grep -Fq 'database_id = "a9a1cd82-2b0e-46a1-910a-706a6bd6f4d9"' "$config"
          grep -Fq 'keep_vars = true' "$config"
          test -f cloud/yura-cloud/src/index.ts
          test -f cloud/yura-cloud/migrations/0010_permanent_points_statistics.sql
          echo 'Verified existing YURA Cloud Worker and D1. No database recreation.'

      - name: Install dependencies
        working-directory: cloud/yura-cloud
        run: npm ci --no-audit --no-fund

      - name: Preflight Worker build without deployment
        working-directory: cloud/yura-cloud
        run: npx wrangler deploy --dry-run

      - name: Apply only unapplied migrations to existing D1
        working-directory: cloud/yura-cloud
        run: npx wrangler d1 migrations apply yura-cloud --remote --yes

      - name: Deploy Worker while preserving dashboard variables and secrets
        working-directory: cloud/yura-cloud
        run: npx wrangler deploy --keep-vars

      - name: Confirm public Worker health
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 3 --retry-connrefused -fsS \
            'https://yura-cloud.heiyeshi.workers.dev/health' \
            | python3 -c 'import json,sys; v=json.load(sys.stdin); assert v.get("ok") is True, "Worker health check did not return ok=true"; print("YURA Cloud HEALTHY:",v.get("version","version unavailable"))'
