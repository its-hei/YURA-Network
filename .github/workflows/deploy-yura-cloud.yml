name: Deploy Y.U.R.A. Cloud

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cloud/yura-cloud/**'

permissions:
  contents: write # Only used once, to commit the initial unpacked source files.

concurrency:
  group: yura-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify, migrate D1 and deploy existing yura-cloud
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets.'
            exit 1
          fi

      - name: Import v3.3.102 release sources on first run only
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f cloud/yura-cloud/src/index.ts ]]; then
            echo 'Cloud source exists; no bootstrap needed.'
            exit 0
          fi
          python3 cloud/tools/bootstrap_cloud.py \
            cloud/bootstrap/YURA_Cloud_v3.3.102.zip cloud/yura-cloud
          (
            cd cloud/yura-cloud
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- cloud/yura-cloud
          git commit -m 'Bootstrap editable Y.U.R.A. Cloud source v3.3.102'
          git push origin HEAD:main

      - name: Verify exact production Worker and D1 before any write
        shell: bash
        run: |
          set -euo pipefail
          config='cloud/yura-cloud/wrangler.toml'
          test -f "$config"
          grep -Eq '^name *= *"yura-cloud"$' "$config"
          grep -Eq '^database_name *= *"yura-cloud"$' "$config"
          grep -Fq 'database_id = "a9a1cd82-2b0e-46a1-910a-706a6bd6f4d9"' "$config"
          grep -Fq 'keep_vars = true' "$config"
          test -f cloud/yura-cloud/src/index.ts
          test -f cloud/yura-cloud/migrations/0010_permanent_points_statistics.sql
          echo 'Verified existing YURA Cloud Worker and D1. No database recreation.'

      - name: Install dependencies
        working-directory: cloud/yura-cloud
        run: npm ci --no-audit --no-fund

      - name: Test Pokemon Market atomic trades and expiry (local SQLite)
        run: python3 cloud/yura-cloud/tests/test_pokemon_market.py

      - name: Test Pokemon slots and atomic payments (local SQLite)
        run: python3 cloud/yura-cloud/tests/test_pokemon_slots.py

      - name: Test auto-drawn slot purchases and rollback (local SQLite)
        run: python3 cloud/yura-cloud/tests/test_pokemon_slot_autodraw.py

      - name: Test Jackpot atomic start, entry and recovery (local SQLite)
        run: python3 cloud/yura-cloud/tests/test_jackpot_start.py

      - name: Check live FFXIV public sources (diagnostic, non-blocking)
        continue-on-error: true
        run: python3 cloud/yura-cloud/tests/test_ffxiv_news_sources.py

      - name: Verify FFXIV event schedules and active status
        run: node --experimental-strip-types --test cloud/yura-cloud/tests/ffxiv-events.test.mjs

      - name: Verify Fashion Reporter Discord follow and manual first image
        run: node --experimental-strip-types --test cloud/yura-cloud/tests/ffxiv-fashion-follow.test.mjs

      - name: Verify Discord retry-after and rate-limit pacing
        run: node --experimental-strip-types --test cloud/yura-cloud/tests/ffxiv-discord-api.test.mjs

      - name: Verify readable FFXIV cards and native Fashion image attachments
        run: node --experimental-strip-types --test cloud/yura-cloud/tests/ffxiv-dashboard.test.mjs

      - name: Verify FC Linkshell requires XIV plus FC (permissions and membership)
        run: node --experimental-strip-types --test cloud/yura-cloud/tests/discord-fc-linkshell.test.mjs

      - name: Verify configurable Discord automatic roles
        run: node --experimental-strip-types --test cloud/yura-cloud/tests/discord-auto-roles.test.mjs

      - name: Test self-role panel permissions and button flow
        run: node --experimental-strip-types --test cloud/yura-cloud/tests/discord-self-roles.test.mjs

      - name: Type-check YURA Cloud TypeScript
        working-directory: cloud/yura-cloud
        run: npx tsc --noEmit

      - name: Preflight Worker build without deployment
        working-directory: cloud/yura-cloud
        run: npx wrangler deploy --dry-run

      - name: Apply only unapplied migrations to existing D1
        working-directory: cloud/yura-cloud
        run: npx wrangler d1 migrations apply yura-cloud --remote

      - name: Deploy Worker while preserving dashboard variables and secrets
        working-directory: cloud/yura-cloud
        run: npx wrangler deploy --keep-vars

      - name: Confirm public Worker health
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 3 --retry-connrefused -fsS \
            'https://yura-cloud.heiyeshi.workers.dev/health' \
            | python3 -c 'import json,sys; v=json.load(sys.stdin); assert v.get("ok") is True, "Worker health check did not return ok=true"; print("YURA Cloud HEALTHY:",v.get("version","version unavailable"))'

      - name: Diagnose FC Linkshell role gate status (read-only)
        continue-on-error: true
        working-directory: cloud/yura-cloud
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute yura-cloud --remote --json \
            --command="SELECT value FROM meta WHERE key='discord_fc_linkshell_last_sync_v1';" \
            > "$RUNNER_TEMP/fc_sync.json"
          python3 - "$RUNNER_TEMP/fc_sync.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          for group in data if isinstance(data,list) else [data]:
              for row in group.get("results",[]):
                  try:
                      info=json.loads(row.get("value","{}"))
                      print("FC LINK:",info.get("status"),"eligible:",info.get("eligible"),"members:",info.get("members"),"error:",info.get("error","")[:160])
                  except (ValueError,TypeError):
                      print("FC LINK: status unavailable")
          PY

      - name: Diagnose production Fashion image delivery (read-only)
        continue-on-error: true
        working-directory: cloud/yura-cloud
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute yura-cloud --remote --json \
            --command="SELECT key, value FROM meta WHERE key IN ('ffxiv_fashion_media_status_v1','ffxiv_fashion_verified_attachment_diagnostic');" \
            > "$RUNNER_TEMP/fashion_media.json"
          python3 - "$RUNNER_TEMP/fashion_media.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          for group in data if isinstance(data,list) else [data]:
              for row in group.get("results",[]):
                  key=row.get("key","")
                  raw=row.get("value","")
                  if key=="ffxiv_fashion_media_status_v1":
                      print("FASHION MEDIA:",str(raw)[:250])
                  elif key=="ffxiv_fashion_verified_attachment_diagnostic":
                      try:
                          result=json.loads(raw)
                          media=result.get("fashion_media") or {}
                          errors=result.get("source_errors") or []
                          print("FASHION VERIFIED:",media.get("attached"),str(media.get("reason",""))[:200])
                          print("FASHION ERRORS:",str(errors)[:260])
                      except (ValueError,TypeError):
                          print("FASHION VERIFIED: unreadable status")
          PY
