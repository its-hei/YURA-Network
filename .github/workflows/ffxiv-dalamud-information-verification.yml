name: Verify official Dalamud information in existing Discord card
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ffxiv-dalamud-information-verification.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: cloud/yura-cloud
      - name: Confirm existing Dalamud Discord message links to official information
        working-directory: cloud/yura-cloud
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            npx wrangler d1 execute yura-cloud --remote --json \
              --command="SELECT key,value FROM meta WHERE key IN ('ffxiv_dalamud_information_v1_20261122','ffxiv_dalamud_information_v1_result') OR key LIKE 'ffxiv_board_v3_%_dalamud';" \
              > "$RUNNER_TEMP/dalamud-info.json"
            if python3 - "$RUNNER_TEMP/dalamud-info.json" <<'PY'
          import json,sys
          raw=json.load(open(sys.argv[1],encoding="utf8"))
          rows={}
          for part in raw if isinstance(raw,list) else [raw]:
              for row in part.get("results",[]):
                  rows[row.get("key")]=row.get("value")
          state=rows.get("ffxiv_dalamud_information_v1_20261122","pending")
          try: outcome=json.loads(rows.get("ffxiv_dalamud_information_v1_result","{}"))
          except ValueError: outcome={}
          saved_versions=[]
          for key,value in rows.items():
              if key.startswith("ffxiv_board_v3_") and key.endswith("_dalamud"):
                  try:
                      record=json.loads(value)
                      saved_versions.append((record.get("current") or {}).get("title","unavailable"))
                  except ValueError: pass
          print("Dalamud information:",state,
                "checked:",outcome.get("checked",0),
                "updated:",outcome.get("updated",0),
                "verified:",outcome.get("verified",0),
                "versions:",saved_versions,
                "errors:",str(outcome.get("errors",outcome.get("error","")))[:260])
          if (state=="done" and outcome.get("checked")==1 and
              outcome.get("verified")==1 and not outcome.get("errors")):
              print("SUCCESS: Same Discord message links to official Dalamud information")
              sys.exit(0)
          sys.exit(1)
          PY
            then exit 0; fi
            sleep 15
          done
          echo "::error::Live Discord Dalamud information link not yet verified"
          exit 1
