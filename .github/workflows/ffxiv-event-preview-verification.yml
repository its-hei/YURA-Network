name: Verify restored FFXIV event preview on Discord
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ffxiv-event-preview-verification.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: cloud/yura-cloud
      - name: Confirm original message and rich Lodestone preview are verified
        working-directory: cloud/yura-cloud
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..8}; do
            npx wrangler d1 execute yura-cloud --remote --json \
              --command="SELECT key,value FROM meta WHERE key IN ('ffxiv_event_rich_preview_v13_20261122','ffxiv_event_compact_v12_result');" \
              > "$RUNNER_TEMP/ffxiv-event-preview.json"
            if python3 - "$RUNNER_TEMP/ffxiv-event-preview.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          vals={}
          for part in data if isinstance(data,list) else [data]:
              for row in part.get("results",[]):
                  vals[row.get("key")]=row.get("value")
          try:
              result=json.loads(vals.get("ffxiv_event_compact_v12_result","{}"))
          except ValueError:
              result={}
          print("EVENT PREVIEW migration:",vals.get("ffxiv_event_rich_preview_v13_20261122","pending"),
                "checked:",result.get("checked",0),"updated:",result.get("updated",0),
                "verified:",result.get("verified",0),
                "errors:",str(result.get("errors",[]))[:400])
          if (vals.get("ffxiv_event_rich_preview_v13_20261122")=="done"
              and result.get("checked")==1 and result.get("verified")==1
              and not result.get("errors")):
              print("SUCCESS: Existing Discord event message has the rich Lodestone preview")
              sys.exit(0)
          sys.exit(1)
          PY
            then exit 0; fi
            sleep 15
          done
          echo "::error::Live Discord has not confirmed the restored event embed"
          exit 1
